plugins { id 'com.android.application' }
android {
    namespace 'ru.hogglike.watchassistant'
    compileSdk 35
    defaultConfig { applicationId 'ru.hogglike.watchassistant'; minSdk 30; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation project(':common'); implementation 'com.google.android.gms:play-services-wearable:19.0.0' }
