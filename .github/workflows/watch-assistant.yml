name: Build Hogg Watch Assistant

on:
  push:
    branches: [copilot-polish]
    paths: ['watch-assistant/**', '.github/workflows/watch-assistant.yml']
  workflow_dispatch:
  workflow_call:
    secrets:
      ZDT_KEYSTORE_BASE64: {required: true}
      ZDT_KEYSTORE_PASSWORD: {required: true}
      ZDT_KEY_ALIAS: {required: true}
      ZDT_KEY_PASSWORD: {required: true}

permissions:
  contents: write

concurrency:
  group: hogg-watch-assistant-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test actual requests and build both applications
        run: |
          gradle --no-daemon -p watch-assistant :common:test :phone:testReleaseUnitTest :phone:assembleRelease :wear:assembleRelease :phone:lintRelease :wear:lintRelease
      - name: Sign both APKs with the existing repository certificate
        env:
          ZDT_KEYSTORE_BASE64: ${{ secrets.ZDT_KEYSTORE_BASE64 }}
          ZDT_KEYSTORE_PASSWORD: ${{ secrets.ZDT_KEYSTORE_PASSWORD }}
          ZDT_KEY_ALIAS: ${{ secrets.ZDT_KEY_ALIAS }}
          ZDT_KEY_PASSWORD: ${{ secrets.ZDT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ZDT_KEYSTORE_BASE64 ZDT_KEYSTORE_PASSWORD ZDT_KEY_ALIAS ZDT_KEY_PASSWORD; do
            test -n "${!name:-}"
          done
          signing_file="$RUNNER_TEMP/hogg-signing.keystore"
          printf '%s' "$ZDT_KEYSTORE_BASE64" | base64 -d > "$signing_file"
          chmod 600 "$signing_file"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p out/hogg-watch
          for app in phone wear; do
            "$tools/zipalign" -f 4 "watch-assistant/$app/build/outputs/apk/release/$app-release-unsigned.apk" "$RUNNER_TEMP/$app-aligned.apk"
            "$tools/apksigner" sign --ks "$signing_file" --ks-key-alias "$ZDT_KEY_ALIAS" --ks-pass env:ZDT_KEYSTORE_PASSWORD --key-pass env:ZDT_KEY_PASSWORD --out "out/hogg-watch/Hogg-Assistant_${app}_0.1.0.apk" "$RUNNER_TEMP/$app-aligned.apk"
            "$tools/apksigner" verify --verbose --print-certs "out/hogg-watch/Hogg-Assistant_${app}_0.1.0.apk"
          done
          rm -f "$signing_file"
          phone_cert="$("$tools/apksigner" verify --print-certs out/hogg-watch/Hogg-Assistant_phone_0.1.0.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          wear_cert="$("$tools/apksigner" verify --print-certs out/hogg-watch/Hogg-Assistant_wear_0.1.0.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$phone_cert"
          test "$phone_cert" = "$wear_cert"
          cp watch-assistant/README_RU.md out/hogg-watch/INSTRUCTION_RU.md
          sha256sum out/hogg-watch/*.apk > out/hogg-watch/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hogg-Assistant-0.1.0
          path: out/hogg-watch/
          retention-days: 30
      - name: Publish separate assistant test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='hogg-assistant-v0.1.0'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title 'Hogg — помощник часов 0.1.0' --notes-file watch-assistant/README_RU.md
          fi
          gh release upload "$tag" out/hogg-watch/* --clobber
