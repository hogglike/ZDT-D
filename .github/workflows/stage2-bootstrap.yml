name: Bootstrap DNS Profiles Stage2

on:
  push:
    branches:
      - dnsprofiles-stage2
    paths:
      - patches/dnsprofiles-stage2.b64.part00
      - patches/dnsprofiles-stage2.b64.part01
      - patches/dnsprofiles-stage2.b64.part02
      - patches/dnsprofiles-stage2.b64.part03
      - patches/dnsprofiles-stage2.b64.part04
      - .github/workflows/stage2-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-stage2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dnsprofiles-stage2

      - name: Decode and apply Stage2 patch
        run: |
          set -euo pipefail
          cat patches/dnsprofiles-stage2.b64.part* | base64 -d | gzip -d > /tmp/dnsprofiles-stage2.patch
          git apply --check /tmp/dnsprofiles-stage2.patch
          git apply /tmp/dnsprofiles-stage2.patch
          git diff --check

      - name: Enable normal build workflow on this test branch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          s = p.read_text()
          needle = "  push:\n    branches:\n      - main\n"
          repl = "  push:\n    branches:\n      - main\n      - dnsprofiles-stage2\n"
          if needle not in s:
              raise SystemExit("build workflow push branch block not found")
          p.write_text(s.replace(needle, repl, 1))
          PY

      - name: Commit real Stage2 source
        run: |
          set -euo pipefail
          rm -f patches/dnsprofiles-stage2.patch.gz.b64
          rm -f patches/dnsprofiles-stage2.b64.part*
          rm -f .github/workflows/stage2-bootstrap.yml
          rmdir patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dnsprofiles: implement per-app DoH runtime auto run compile"
          git push origin HEAD:dnsprofiles-stage2
