name: Trigger Stage2 Full Build

on:
  push:
    branches:
      - dnsprofiles-stage2
    paths:
      - .github/workflows/stage2-trigger-build.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing full build for Stage2 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches             -d '{"ref":"dnsprofiles-stage2","inputs":{"build_type":"Debug"}}'
